<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../library/jquery-3.3.1.min.js" type="text/javascript"></script>
    <title>LRS DataAnalyst</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header class="navbar">
        <div class="navbar-left">
            <h1>LRS DataAnalyst</h1>
        </div>
        <div class="navbar-right">
            <button class="history-btn">Historique des requtes</button>
            <button class="login-btn">Se déconnecter</button>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <div class="date-filter">
                <h3>Filtres</h3>
                <label for="start-date">Du :</label>
                <input type="date" id="start-date" value="2021-01-01">
                <label for="end-date">Au :</label>
                <input type="date" id="end-date">
            </div>

            <div class="generic-filters">
                <div class="filter-actions">
                    <button id="select-all">Sélectionner tous les filtres</button>
                    <button id="deselect-all">Désélectionner tous les filtres</button>
                </div>
                <ul id="filter-list">
                    <li><label><input type="checkbox" class="filter-checkbox" data-column="Action"> Action</label></li>
                    <li><label><input type="checkbox" class="filter-checkbox" data-column="Objet"> Objet</label></li>
                    <li><label><input type="checkbox" class="filter-checkbox" data-column="Score"> Score</label></li>
                </ul>
            </div>
        </aside>

        <section class="content">
            <div class="table-container">
                <table id="data-table">
                    <thead>
                        <tr id="table-header">
                            <!-- Columns will be added here -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows will be added here -->
                    </tbody>
                </table>
            </div>
            <div class="actions-bottom">
                <button id="download-csv" disabled>Télécharger .csv</button>
            </div>
            <div class="actions-bottom">
                <button id="test-btn"><a href="test.html">Test route</a></button>
            </div>
        </section>
    </main>

    <script src="../scripts/home_script.js"></script>
</body>

</html>
