[PHP]
memory_limit = 128M
post_max_size = 32M
upload_max_filesize = 16M
max_file_uploads = 20

allow_url_fopen = On

default_socket_timeout = 60

default_charset = "UTF-8"

error_reporting = E_ALL & E_DEPRECATED & E_NOTICE & E_WARNING
log_errors = On
display_errors = Off
html_errors = Off
error_prepend_string = "<pre>"
error_append_string = "</pre>"
